name: DUKAAN Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # ========================================================
  # Stage 1: Code Quality, Lint & Build Verification
  # ========================================================
  verify-and-test:
    name: 🧪 1. Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Check & Frontend Production Build
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Verify Backend Syntax & Startup Sanity
        working-directory: ./server
        run: node -c src/index.js

  # ========================================================
  # Stage 2: Security & Dependency Vulnerability Audit
  # ========================================================
  security-audit:
    name: 🛡️ 2. Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [verify-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high || true

      - name: Audit Backend Dependencies
        working-directory: ./server
        run: npm audit --audit-level=high || true

  # ========================================================
  # Stage 3: Validate Kubernetes Manifests Syntax & Schema
  # ========================================================
  validate-k8s:
    name: ☸️ 3. Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [verify-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Kustomize & Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Validate Kustomize Build & Schema Correctness
        run: |
          echo "Verifying Kubernetes manifests in k8s/ directory..."
          kubectl kustomize k8s/ > /dev/null
          echo "✓ All Kubernetes manifests are syntactically valid and properly ordered!"

  # ========================================================
  # Stage 4: Docker Multi-Stage Build & Container Registry Push
  # ========================================================
  build-and-push-docker:
    name: 🐳 4. Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [security-audit, validate-k8s]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Frontend Image
      - name: Extract Frontend Docker Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Backend Image
      - name: Extract Backend Docker Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Stage 5: Zero-Downtime Rolling Kubernetes Deployment
  # ========================================================
  deploy-production:
    name: 🚀 5. Zero-Downtime Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set Kubernetes Context (if KUBECONFIG secret provided)
        if: "${{ secrets.KUBECONFIG != '' }}"
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Kubernetes Stack in Exact Sequence
        if: "${{ secrets.KUBECONFIG != '' }}"
        run: |
          echo "Applying Kubernetes manifests in correct sequential order..."
          kubectl apply -k k8s/
          
          echo "Awaiting zero-downtime rolling update status..."
          kubectl rollout status deployment/dukaan-backend -n dukaan-production --timeout=180s
          kubectl rollout status deployment/dukaan-frontend -n dukaan-production --timeout=180s
          echo "🎉 DUKAAN Production Stack successfully deployed to Kubernetes!"
