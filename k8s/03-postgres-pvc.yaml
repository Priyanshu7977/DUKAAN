apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dukaan-postgres-pvc
  namespace: dukaan-production
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dukaan-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dukaan-backup-pvc
  namespace: dukaan-production
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: dukaan-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
