apiVersion: v1
kind: Service
metadata:
  name: dukaan-frontend-service
  namespace: dukaan-production
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: dukaan-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
  selector:
    app: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dukaan-frontend-pdb
  namespace: dukaan-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
