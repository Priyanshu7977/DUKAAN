apiVersion: batch/v1
kind: CronJob
metadata:
  name: dukaan-postgres-daily-backup
  namespace: dukaan-production
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: dukaan-platform
spec:
  schedule: "0 2 * * *" # Runs daily at 2:00 AM UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup-worker
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups"
                  mkdir -p ${BACKUP_DIR}
                  
                  echo "==> [$(date)] Starting automated backup for ${DB_NAME} from ${DB_HOST}..."
                  export PGPASSWORD=${POSTGRES_PASSWORD}
                  pg_dump -h ${DB_HOST} -U ${DB_USER} -d ${DB_NAME} -F c -b -v -f "${BACKUP_DIR}/dukaan_backup_${TIMESTAMP}.dump"
                  
                  # Prune backups older than 14 days
                  find ${BACKUP_DIR} -name "dukaan_backup_*.dump" -type f -mtime +14 -delete
                  echo "==> [$(date)] Backup completed successfully: dukaan_backup_${TIMESTAMP}.dump"
              env:
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: dukaan-config
                      key: DB_HOST
                - name: DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: dukaan-config
                      key: DB_USER
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: dukaan-config
                      key: DB_NAME
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dukaan-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: dukaan-backup-pvc
