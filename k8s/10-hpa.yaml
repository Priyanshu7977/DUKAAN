apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dukaan-backend-hpa
  namespace: dukaan-production
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: dukaan-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dukaan-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dukaan-frontend-hpa
  namespace: dukaan-production
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: dukaan-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dukaan-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
